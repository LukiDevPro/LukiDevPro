<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none" role="img" aria-labelledby="t d">
  <title id="t">LukiDevPro</title>
  <desc id="d">Backend, bots and game servers — Python, C#, JavaScript</desc>

  <defs>
    <linearGradient id="title" x1="68" y1="60" x2="430" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="55%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#30363D"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="900" height="200" rx="14"/>
    </clipPath>

    <style>
      .float-a { animation: floatA 11s ease-in-out infinite; }
      .float-b { animation: floatB 14s ease-in-out infinite; }
      .edge    { stroke-dashoffset: 0; animation: orbit 5.5s linear infinite; }
      .caret   { animation: blink 1.15s steps(1) infinite; }
      .bar1    { animation: pulse 4s ease-in-out infinite; }
      .bar2    { animation: pulse 4s ease-in-out infinite .5s; }
      .bar3    { animation: pulse 4s ease-in-out infinite 1s; }

      @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-26px,16px); } }
      @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,-20px); } }
      @keyframes orbit  { to { stroke-dashoffset: -2165.16; } }
      @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse  { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .float-a, .float-b, .edge, .caret, .bar1, .bar2, .bar3 { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="200" fill="#0D1117"/>
    <rect width="900" height="200" fill="url(#dots)" opacity="0.55"/>

    <g filter="url(#blur)">
      <circle class="float-a" cx="790" cy="30" r="95" fill="#7C3AED" opacity="0.30"/>
      <circle class="float-b" cx="880" cy="185" r="80" fill="#22D3EE" opacity="0.20"/>
      <circle class="float-b" cx="40"  cy="200" r="70" fill="#A855F7" opacity="0.14"/>
    </g>

    <!-- decorative code bars -->
    <g transform="translate(628,64)">
      <rect class="bar1" x="0"  y="0"  width="176" height="9" rx="4.5" fill="#21262D"/>
      <rect class="bar2" x="0"  y="22" width="120" height="9" rx="4.5" fill="#30363D"/>
      <rect class="bar3" x="0"  y="44" width="200" height="9" rx="4.5" fill="#A855F7" opacity="0.45"/>
      <rect class="bar2" x="0"  y="66" width="92"  height="9" rx="4.5" fill="#22D3EE" opacity="0.35"/>
    </g>

    <rect x="44" y="46" width="4" height="108" rx="2" fill="url(#accent)"/>

    <text x="68" y="94"
          font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="44" font-weight="700" letter-spacing="-0.8" fill="url(#title)">LukiDevPro</text>
    <rect class="caret" x="316" y="62" width="4" height="38" rx="1" fill="#22D3EE"/>

    <text x="69" y="124"
          font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="15.5" fill="#8B949E">@DarkLuki  ·  backend, bots &amp; game servers</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C9D1D9">
      <rect x="69"  y="145" width="78"  height="26" rx="13" fill="#161B22" stroke="#30363D"/>
      <text x="108" y="162" text-anchor="middle">Python</text>

      <rect x="155" y="145" width="52"  height="26" rx="13" fill="#161B22" stroke="#30363D"/>
      <text x="181" y="162" text-anchor="middle">C#</text>

      <rect x="215" y="145" width="98"  height="26" rx="13" fill="#161B22" stroke="#30363D"/>
      <text x="264" y="162" text-anchor="middle">JavaScript</text>

      <rect x="321" y="145" width="100" height="26" rx="13" fill="#161B22" stroke="#30363D"/>
      <text x="371" y="162" text-anchor="middle">HTML · CSS</text>
    </g>

    <rect x="0.5" y="0.5" width="899" height="199" rx="14" fill="none" stroke="#21262D"/>

    <!-- light travelling around the full border; measured path length 2165.16 -->
    <g stroke="url(#edgeGrad)" stroke-linecap="round" fill="none" stroke-dasharray="230 1935.16">
      <rect class="edge" x="1.5" y="1.5" width="897" height="197" rx="13"
            stroke-width="5" opacity="0.55" filter="url(#soft)"/>
      <rect class="edge" x="1.5" y="1.5" width="897" height="197" rx="13"
            stroke-width="2"/>
    </g>
  </g>
</svg>
